name: 🛡️ Firestore Scheduled Backup

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install firebase-admin

      - name: 🚀 Run Backup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/run-dated-backup.js

      - name: 💾 Commit and Push Backup
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          git config --global user.name "UniTask Backup Bot"
          git config --global user.email "backup-bot@unitask.ai"
          
          # Stage new files
          git add backups/
          
          # Atomic sync to Remote HEAD while preserving uncommitted local changes in the working tree
          git fetch origin main
          git reset --mixed origin/main
          
          # Restage files for current HEAD index
          git add backups/
          
          # Only commit and push if there are diffs
          if git status --porcelain | grep . > /dev/null; then
            git commit -m "🛡️ Auto-backup: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No backup changes detected. Nothing to push."
          fi
