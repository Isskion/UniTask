name: 🛡️ Firestore Scheduled Backup

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install firebase-admin

      - name: 🚀 Run Backup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/run-dated-backup.js

      - name: 💾 Commit and Push Backup
        run: |
          git config --global user.name "UniTask Backup Bot"
          git config --global user.email "backup-bot@unitask.ai"
          git add backups/
          git commit -m "🛡️ Auto-backup: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
