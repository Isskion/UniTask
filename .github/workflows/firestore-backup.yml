name: 🛡️ Firestore Scheduled Backup

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install firebase-admin

      - name: 🚀 Run Backup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/run-dated-backup.js
          node scripts/format-backup-for-git.js

      - name: 💾 Commit and Push Backup
        run: |
          git config --global user.name "UniTask Backup Bot"
          git config --global user.email "backup-bot@unitask.ai"
          
          # Stage new files (rules from backups/ and split collections from git_backup_data/)
          git add backups/ git_backup_data/
          
          # Atomic sync to Remote HEAD while preserving uncommitted local changes in the working tree
          git fetch origin main
          git reset --mixed origin/main
          
          # Restage files for current HEAD index
          git add backups/ git_backup_data/
          
          # Only commit and push if there are staged differences
          if ! git diff --cached --quiet; then
            git commit -m "🛡️ Auto-backup: $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          else
            echo "No backup changes detected. Nothing to push."
          fi

