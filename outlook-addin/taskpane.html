<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniTask Connector</title>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            background-color: #09090b;
            color: #fafafa;
            margin: 0;
        }
        .container { display: flex; flex-direction: column; gap: 16px; }
        .header { display: flex; items-center: center; gap: 8px; margin-bottom: 8px; }
        .logo { width: 24px; height: 24px; }
        .title { font-size: 18px; font-weight: 700; color: #e11d48; }
        .label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #a1a1aa; letter-spacing: 0.05em; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        input, textarea {
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #fafafa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea { height: 100px; resize: none; }
        .status { font-size: 12px; color: #71717a; padding: 8px; border-radius: 4px; background: #18181b; }
        .button {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .button:hover { opacity: 0.9; }
        .button:disabled { background-color: #27272a; color: #71717a; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://unitask-next.vercel.app/logo.png" class="logo" alt="Logo">
            <span class="title">UniTask</span>
        </div>

        <div id="content" class="container">
            <div class="input-group">
                <span class="label">Asunto del Correo</span>
                <input type="text" id="subject" placeholder="Cargando asunto..." readonly>
            </div>
            
            <div class="input-group">
                <span class="label">Contenido Extraído</span>
                <textarea id="body" placeholder="Extrayendo contenido del correo..."></textarea>
            </div>

            <div id="status" class="status">Listo para capturar.</div>

            <button id="send-btn" class="button">Crear Tarea en UniTask</button>
        </div>
    </div>
    <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
